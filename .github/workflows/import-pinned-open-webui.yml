name: Import pinned Open WebUI snapshot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-pinned-open-webui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinned-open-webui-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out empty destination
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Import and verify the exact upstream source tree
        shell: bash
        env:
          SOURCE_COMMIT: 1dfb479d367e5f5902f051c823f9aef836e04791
          SOURCE_TREE: cc27e9888c6835dbb39183562861fb1b567e4141
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/open-webui-source"
          mkdir -p "$SOURCE_DIR"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            "https://codeload.github.com/open-webui/open-webui/tar.gz/${SOURCE_COMMIT}" \
            --output "$RUNNER_TEMP/open-webui-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/open-webui-source.tar.gz" \
            -C "$SOURCE_DIR" --strip-components=1
          test -f "$SOURCE_DIR/LICENSE"
          grep -q '^MIT License$' "$SOURCE_DIR/LICENSE"

          # Replace the disposable bootstrap workflow with the exact source snapshot.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SOURCE_DIR/." .
          git add --all --force
          ACTUAL_TREE="$(git write-tree)"
          echo "Expected upstream Git tree: ${SOURCE_TREE}"
          echo "Staged destination Git tree: ${ACTUAL_TREE}"
          if [ "$ACTUAL_TREE" != "$SOURCE_TREE" ]; then
            echo "::error::Source tree verification failed; destination will not be pushed."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import MIT Open WebUI snapshot ${SOURCE_COMMIT}" \
            -m "Source: https://github.com/open-webui/open-webui/tree/${SOURCE_COMMIT}" \
            -m "Verified source tree: ${SOURCE_TREE}"
          git push origin HEAD:main
